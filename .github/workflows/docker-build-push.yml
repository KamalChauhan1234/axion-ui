name: Trigger auto deployment for axion-ui-test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AXIONUITEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AXIONUITEST_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AXIONUITEST_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: axionuiacr123.azurecr.io
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: axion-ui-test
          resourceGroup: rg-test
          imageToBuild: axionuiacr123.azurecr.io/axion-ui:${{ github.sha }}
          targetPort: 80
          ingress: external
