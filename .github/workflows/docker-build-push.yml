name: Axion UI CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write


env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ vars.ACR_LOGIN_SERVER }}

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG \
            .

      - name: Push Docker image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image: .*|image: $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG|g" manifest/deployment-ui.yaml

      - name: Commit manifest change
        run: |
          git config user.name "KamalChauhan1234"
          git config user.email "kamalchauhan0037@gmail.com"

          git add manifest/deployment-ui.yaml

          git commit -m "Update axion-ui image to $IMAGE_TAG" || echo "No changes"

          git push