name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Ye step apni purani file wala hi rehne do (azure/login wala, apne secrets ke saath)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.<TUMHARA_CLIENT_ID_SECRET> }}
          tenant-id: ${{ secrets.<TUMHARA_TENANT_ID_SECRET> }}
          subscription-id: ${{ secrets.<TUMHARA_SUBSCRIPTION_ID_SECRET> }}

      - name: Build and deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          acrName: axionuiacr123              # apni ACR ka naam
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}
          imageToBuild: axionuiacr123.azurecr.io/axion-ui:${{ github.sha }}
          containerAppName: axion-ui-test
          resourceGroup: rg-test
          targetPort: 80
          ingress: external
