apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
spec:
  selector:
    matchLabels:
      app: axion-ui
  template:
    metadata:
      labels:
        app: axion-ui
    spec:
      containers:
      - name: axion-ui
        image: acrdevtodoacr.azurecr.io/axionuidev:0c774c94296667c9df49276d995fac0b4f3586b3
        ports:
        - containerPort: 80
